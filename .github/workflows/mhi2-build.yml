name: MHI2 portable build

on:
  workflow_dispatch:
  push:
    branches: [main, mhi2-portable-build, mhi2-host-parity]
    paths:
      - 'hw/**'
      - 'tools/mhi2/**'
      - '.github/workflows/mhi2-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Extract source ZIP without Git metadata
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          mkdir "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test ! -e "$RUNNER_TEMP/source/.git"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libpixman-1-dev libegl-dev libgles-dev liblzo2-dev libavcodec-dev libavutil-dev libswscale-dev libusb-1.0-0-dev libslirp-dev ffmpeg sox python3-venv
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf glib pixman mesa lzo libusb libslirp ffmpeg sox python
      - name: ARM toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$(uname -s)" in Darwin) system=darwin;; Linux) system=linux;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64;; x86_64) arch=x64;; esac
          asset=xpack-arm-none-eabi-gcc-13.3.1-1.1-$system-$arch.tar.gz
          mkdir -p "$RUNNER_TEMP/toolchain"
          cd "$RUNNER_TEMP/toolchain"
          gh release download v13.3.1-1.1 --repo xpack-dev-tools/arm-none-eabi-gcc-xpack --pattern "$asset*"
          shasum -a 256 -c "$asset.sha"
          tar -xzf "$asset"
          echo "$PWD/xpack-arm-none-eabi-gcc-13.3.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Pinned QEMU dependencies
        run: |
          cd "$RUNNER_TEMP/source"
          python3 tools/mhi2/check_source_build.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/mhi2')
          from build_audi import build_dependencies
          build_dependencies(Path('../dependencies'))
          PY
      - name: Build QEMU
        run: |
          mkdir "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/source/configure" --target-list=arm-softmmu --disable-docs --disable-sdl --disable-gtk --disable-fuse --disable-rust --disable-werror --enable-libusb --enable-slirp
          ninja -j 3 qemu-system-arm
          ./qemu-system-arm -machine help | grep mhi2
      - name: Check SDIO Wi-Fi and Bluetooth transports
        run: |
          python3 "$RUNNER_TEMP/source/tools/mhi2/check_wireless.py" --qemu "$RUNNER_TEMP/build/qemu-system-arm"
      - name: Check cellular USB modem and network transport
        run: |
          python3 "$RUNNER_TEMP/source/tools/mhi2/check_emulator_config.py"
          python3 "$RUNNER_TEMP/source/tools/mhi2/check_native_network.py"
          python3 "$RUNNER_TEMP/source/tools/mhi2/check_modem.py" --qemu "$RUNNER_TEMP/build/qemu-system-arm" --mode 3g
          python3 "$RUNNER_TEMP/source/tools/mhi2/check_modem.py" --qemu "$RUNNER_TEMP/build/qemu-system-arm" --mode 4g
      - name: Build host and guest bridges
        env:
          MHI2_BUILD_LIBRARIES_ONLY: '1'
        run: |
          cd "$RUNNER_TEMP/source"
          export MHI2_BUILD_DIR="$RUNNER_TEMP/bridge"
          bash tools/mhi2/glforward/build_local.sh
      - name: Check portable image preparation and GLES protocol
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd "$RUNNER_TEMP/source"
          python3 tools/mhi2/check_sparse_copy.py
          python3 tools/mhi2/check_lzo_library.py
          python3 tools/mhi2/check_kanzi_shaders.py
          MHI2_GLHOST="$RUNNER_TEMP/bridge/mhi2-glhost" python3 tools/mhi2/glforward/check_client_indices.py
          "$RUNNER_TEMP/bridge/mhi2-glhost" --check-shaders
          python3 tools/mhi2/glforward/check_video.py
          python3 tools/mhi2/check_encoder.py
          python3 tools/mhi2/check_audio.py
